name: Daily Movie Shorts Auto Upload

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & eSpeak)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak libespeak1

      - name: Install Python Tools
        run: |
          pip install requests yt-dlp gTTS pillow

      - name: Run Auto Reels Bot
        run: python bot.py
